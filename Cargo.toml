[workspace]
resolver = "2"

members = [
    "crates/vn_script",
    "crates/vn_engine",
    "crates/vn_build",
    "crates/vn_cli",
    "examples/god_is_watching",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
vn_script = { path = "crates/vn_script" }
vn_engine = { path = "crates/vn_engine" }
vn_build = { path = "crates/vn_build" }
raylib = "5.5.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
