name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Format, lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: System libraries raylib builds against
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            cmake libasound2-dev libx11-dev libxrandr-dev libxi-dev \
            libxcursor-dev libxinerama-dev libgl1-mesa-dev libglu1-mesa-dev \
            libwayland-dev libxkbcommon-dev

      - name: A virtual display and a software renderer for the tests that draw
        run: sudo apt-get install --no-install-recommends -y xvfb libgl1-mesa-dri

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all -- --check

      - run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Clippy with character-visuals, which the default build leaves out
        run: cargo clippy -p novn --features character-visuals --all-targets -- -D warnings

      - run: cargo test --workspace

      - name: Test with character-visuals
        run: cargo test -p novn --features character-visuals

      - name: The tests that open a window, on a virtual display
        run: xvfb-run -a cargo test -p novn --features character-visuals -- --ignored --test-threads=1

  docs:
    name: The documentation site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v4

      - name: pnpm, at the version docs/package.json pins
        uses: pnpm/action-setup@v4
        with:
          package_json_file: docs/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - name: No hand-written absolute URLs, which skip the deployed basePath
        run: |
          if grep -rnE '(<a[^>]+href|<(img|Image|video|source|link)[^>]+(src|href)|url\()="/[^/]' src; then
            echo
            echo "A path written by hand does not get the /novn prefix the deployed"
            echo "site is served under. Links go through next/link, which adds it;"
            echo "images are imported as modules, which the bundler rewrites."
            exit 1
          fi

      - name: The highlighting queries match the grammar they came from
        working-directory: .
        run: diff editors/tree-sitter-story/queries/highlights.scm docs/src/highlight/story.scm

      - name: Build the static export, which typechecks it too
        run: pnpm build

      - name: Keep the export for the deploy job
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/out

  deploy:
    name: Publish to Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: docs
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - id: pages
        uses: actions/deploy-pages@v4

  video:
    name: The video backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: FFmpeg and the libraries raylib builds against
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            cmake clang libclang-dev pkg-config \
            libasound2-dev libx11-dev libxrandr-dev libxi-dev libxcursor-dev \
            libxinerama-dev libgl1-mesa-dev libglu1-mesa-dev libwayland-dev \
            libxkbcommon-dev libavcodec-dev libavformat-dev libavfilter-dev \
            libavdevice-dev libavutil-dev libswscale-dev libswresample-dev

      - uses: Swatinem/rust-cache@v2
        with:
          key: video

      - name: Clippy the video backend and its example, which nothing else compiles
        run: cargo clippy -p novn --features video-ffmpeg --all-targets -- -D warnings

      - run: cargo test -p novn --features video-ffmpeg
