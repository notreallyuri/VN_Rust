[package]
name = "novn"
description = "raylib-based visual novel engine built on novn-script."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["visual-novel", "gamedev", "raylib", "engine", "storytelling"]
categories = ["game-engines", "game-development"]

[features]
default = []
character-visuals = []
video = ["video-portable", "rav1d/asm", "rav1d/bitdepth_16"]
video-portable = ["dep:rav1d", "dep:matroska-demuxer", "dep:lewton", "dep:libc"]
video-ffmpeg = ["dep:ffmpeg-next", "dep:tempfile"]

[dependencies]
novn-script.workspace = true
novn-macros.workspace = true
raylib.workspace = true
serde.workspace = true
serde_json.workspace = true
rav1d = { version = "1.1", optional = true, default-features = false, features = ["bitdepth_8"] }
matroska-demuxer = { version = "0.8", optional = true }
lewton = { version = "0.10", optional = true, default-features = false }
libc = { version = "0.2", optional = true }
ffmpeg-next = { version = "9.0", optional = true, default-features = false, features = ["format", "software-scaling", "software-resampling"] }
tempfile = { version = "3", optional = true }

[target.'cfg(target_arch = "aarch64")'.dependencies]
rav1d = { version = "1.1", optional = true, default-features = false, features = ["bitdepth_8", "bitdepth_16", "asm", "asm_arm64_dotprod", "asm_arm64_i8mm"] }

[dev-dependencies]
serde.workspace = true
